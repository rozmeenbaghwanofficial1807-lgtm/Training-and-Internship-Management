<div class="table-responsive"><table class="table table-striped"><thead><tr><th>Internship</th><th>Company</th><th>Status</th><th>Applied on</th></tr></thead><tbody>{% for a in applications %}<tr><td>{{ a.internship.title }}</td><td>{{ a.internship.company.company_name }}</td><td><span class="badge text-bg-secondary">{{ a.status }}</span></td><td>{{ a.applied_at.strftime('%d %b %Y') }}</td></tr>{% else %}<tr><td colspan="4">No applications yet.</td></tr>{% endfor %}</tbody></table></div>
