{% extends 'base.html' %}{% block content %}<h2>Internship approvals</h2><div class="table-responsive"><table class="table table-striped"><tr><th>Title</th><th>Company</th><th>Domain</th><th>Status</th><th>Action</th></tr>{% for i in internships %}<tr><td>{{ i.title }}</td><td>{{ i.company.company_name }}</td><td>{{ i.domain }}</td><td>{{ i.status }}</td><td><form method="post" action="{{ url_for('admin.internship_approval', internship_id=i.id) }}" class="d-flex gap-1"><button class="btn btn-sm btn-success" name="status" value="Approved">Approve</button><button class="btn btn-sm btn-outline-danger" name="status" value="Rejected">Reject</button><button class="btn btn-sm btn-outline-secondary" name="status" value="Closed">Close</button></form></td></tr>{% else %}<tr><td colspan="5">No internships submitted.</td></tr>{% endfor %}</table></div>{% endblock %}
