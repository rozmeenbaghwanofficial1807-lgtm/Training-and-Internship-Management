{% extends 'base.html' %}{% block content %}<h2>Company management</h2><div class="table-responsive"><table class="table table-striped"><tr><th>Company</th><th>Email</th><th>Status</th><th>Action</th></tr>{% for c in companies %}<tr><td>{{ c.company_name }}</td><td>{{ c.user.email }}</td><td>{{ c.approval_status }}</td><td><form method="post" action="{{ url_for('admin.company_approval', company_id=c.id) }}" class="d-flex gap-1"><button class="btn btn-sm btn-success" name="status" value="Approved">Approve</button><button class="btn btn-sm btn-outline-danger" name="status" value="Rejected">Reject</button></form></td></tr>{% else %}<tr><td colspan="4">No companies registered.</td></tr>{% endfor %}</table></div>{% endblock %}
