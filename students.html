{% extends 'base.html' %}{% block content %}<h2>Registered students</h2><div class="table-responsive"><table class="table table-striped"><tr><th>Name</th><th>Email</th><th>College</th><th>Course</th></tr>{% for s in students %}<tr><td>{{ s.full_name }}</td><td>{{ s.user.email }}</td><td>{{ s.college or '-' }}</td><td>{{ s.course or '-' }}</td></tr>{% else %}<tr><td colspan="4">No students registered.</td></tr>{% endfor %}</table></div>{% endblock %}
