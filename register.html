{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}
<div class="form-card mx-auto"><h2 class="mb-3">Create account</h2><form method="post"><label class="form-label">Full name / Company name</label><input class="form-control mb-3" name="name" required><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password (minimum 8 characters)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required><label class="form-label">Register as</label><select class="form-select mb-3" name="role"><option>Student</option><option>Company</option></select><button class="btn btn-primary w-100">Register</button></form></div>{% endblock %}
