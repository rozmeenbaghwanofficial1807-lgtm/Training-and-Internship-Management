{% extends 'base.html' %}{% block content %}<h2>My profile</h2><form method="post" enctype="multipart/form-data" class="form-card"><label class="form-label">Full name</label><input class="form-control mb-3" name="full_name" value="{{ profile.full_name }}" required><label class="form-label">Phone</label><input class="form-control mb-3" name="phone" value="{{ profile.phone or '' }}"><label class="form-label">College</label><input class="form-control mb-3" name="college" value="{{ profile.college or '' }}"><label class="form-label">Course</label><input class="form-control mb-3" name="course" value="{{ profile.course or '' }}"><label class="form-label">Skills</label><textarea class="form-control mb-3" name="skills" rows="3">{{ profile.skills or '' }}</textarea><label class="form-label">Resume (PDF, DOC, DOCX; max 5 MB)</label><input class="form-control mb-3" type="file" name="resume" accept=".pdf,.doc,.docx">{% if profile.resume_path %}<p>Current resume: {{ profile.resume_path }}</p>{% endif %}<button class="btn btn-primary">Save profile</button></form>{% endblock %}
