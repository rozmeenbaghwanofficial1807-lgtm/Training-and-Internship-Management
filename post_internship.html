{% extends 'base.html' %}{% block content %}<div class="form-card"><h2>Post an internship</h2><form method="post"><label class="form-label">Title</label><input class="form-control mb-3" name="title" required><label class="form-label">Domain</label><input class="form-control mb-3" name="domain" placeholder="Python, Web Development..." required><label class="form-label">Description</label><textarea class="form-control mb-3" name="description" rows="5" required></textarea><label class="form-label">Duration</label><input class="form-control mb-3" name="duration" placeholder="3 months"><label class="form-label">Location</label><input class="form-control mb-3" name="location"><label class="form-label">Stipend</label><input class="form-control mb-3" name="stipend" placeholder="Unpaid / ₹5000 per month"><label class="form-label">Application deadline</label><input class="form-control mb-3" type="date" name="deadline"><button class="btn btn-primary">Submit for approval</button></form></div>{% endblock %}
