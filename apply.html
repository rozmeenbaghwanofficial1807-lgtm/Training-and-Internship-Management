{% extends 'base.html' %}{% block content %}<div class="form-card"><h2>Apply: {{ internship.title }}</h2><p>{{ internship.company.company_name }} · {{ internship.domain }}</p><form method="post" enctype="multipart/form-data"><label class="form-label">Resume (optional if already saved in your profile)</label><input class="form-control mb-3" type="file" name="resume" accept=".pdf,.doc,.docx"><label class="form-label">Cover letter</label><textarea class="form-control mb-3" name="cover_letter" rows="5" placeholder="Tell the company why you are interested..."></textarea><button class="btn btn-primary">Submit application</button></form></div>{% endblock %}
